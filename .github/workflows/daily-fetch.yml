name: 每日台股資料更新

on:
  schedule:
    # P1-2 時段重分配（總數不增，分鐘避開整點——GitHub 整點排程常延遲 5-30 分）。
    # 事件驅動為主：n8n Phase1（籌碼就緒 ~16:00）與 Phase2（融資就緒 ~19:00+）都會 dispatch，
    # 以下 cron 是保險班次。
    # 台北 14:05 → 2026-09-04 實測 TWSE 在 13:54~13:57 之間發布當日收盤行情
    #（收盤後約 25 分鐘）。這班專門搶當天股價——此時 FMTQIK 還沒有今日 K 棒，
    # 靠 guard-check 的「收盤後股價未到」條件放行（見 AC-SD-5）
    - cron: '5 6 * * 1-5'
    # 台北 15:37 → FMTQIK 15:30 就緒，第一時間更新大盤 K 線
    - cron: '37 7 * * 1-5'
    # 台北 16:07 → T86 約 16:00 起可用，泡泡圖首班
    - cron: '7 8 * * 1-5'
    # 台北 17:07 → T86/股價補跑
    - cron: '7 9 * * 1-5'
    # 台北 18:37 → 融資（MI_MARGN）常在 17:00-19:00 發布
    - cron: '37 10 * * 1-5'
    # 台北 20:07 → 補跑 STOCK_DAY_ALL 較晚更新
    - cron: '7 12 * * 1-5'
    # 台北 22:07
    - cron: '7 14 * * 1-5'
    # 台北 23:37 → 補捉 STOCK_DAY_ALL 深夜更新（過午夜 Guard 2 就封死了）
    - cron: '37 15 * * 1-5'
    # P2-3：台北 06:07 → 全球指數輕量班次（獨立 job，不跑主 pipeline）。
    # 台北 06:07 = UTC 前一天 22:07。改成天天跑（含週末，2026-07-12 Franky 確認）：
    # 美股週五收盤要台北週六早上才拿得到、台灣休市時國際市場照常交易
    - cron: '7 22 * * *'
    # 亞股專屬班次：台北 15:32 = UTC 07:32。日經 14:00、KOSPI 14:30（台北時間）都已收盤，
    # 這時抓才有「當天」的日韓資料——06:07 那班對亞股永遠是前一天（當天還沒開盤）。
    # 六個指數一起抓（<1 分鐘），美股在這個時點仍是前一交易日，重抓同值無害。
    - cron: '32 7 * * 1-5'
    # 不受開盤限制的補課班次：STOCK_DAY_ALL／融資常常深夜才發布，原本最晚 23:37
    # 那班之後到隔天 15:37 之間完全沒有機會追。這兩班天天跑（含假日，成本可忽略——
    # public repo 無 Actions 分鐘限制），略過 FMTQIK Guard，只為了盡快撿到遲到的資料。
    # 台北 02:07 = UTC 前一天 18:07
    - cron: '7 18 * * *'
    # 台北 08:07 = UTC 00:07
    - cron: '7 0 * * *'
    # 2026-09-04 事故：TWSE 在台北 04:56~10:52 之間才發布 09/03 的 STOCK_DAY_ALL，
    # 而 08:07 那班被 GitHub 漏跑（排程不保證執行），結果整個上午股價都停在前天。
    # 上午補兩班把空窗補起來——被 Guard 攔的話 30 秒就結束，成本可忽略；
    # 真的有資料落後時，guard-check 的落後偵測（AC-FIX-4）會放行。
    # 台北 09:37 = UTC 01:37、台北 11:37 = UTC 03:37
    - cron: '37 1 * * 1-5'
    - cron: '37 3 * * 1-5'
    # 選擇權 OI 專用輕量班次（AC-OI-A8）：期交所 2026-09-08 實測 14:37 才放出當日 OI
    #（14:33 仍為 0），所以 14:05 那班（沿用上面搶股價的 '5 6'）注定是空的、留著當早鳥保險，
    # 正常情況 14:45 這班第一次抓到，後面兩班備援 GitHub 排程本身 5~15 分鐘的延遲。
    # 這四班只跑 options-oi job，不跑主 pipeline。台北 14:25/14:45/15:05/15:25
    - cron: '25 6 * * 1-5'
    - cron: '45 6 * * 1-5'
    - cron: '5 7 * * 1-5'
    - cron: '25 7 * * 1-5'
  workflow_dispatch: # n8n Phase1/Phase2 完成後觸發，或手動補跑
    inputs:
      force_run:
        description: '略過 FMTQIK Guard，強制跑完整 pipeline（本機不要再直接跑 fetch-daily.mjs/write-firebase.mjs 寫 production——iCloud 會干擾 data/latest.json，2026-07-10 已經證實會悄悄還原成舊內容，一律用這個 workflow_dispatch 補跑）'
        type: boolean
        default: false
      fetch_global:
        description: 'R7：單獨補跑全球指數（原本只有台北 06:07 那班會跑，失敗要等 24 小時；建議挑各市場都收盤的時段觸發，見 R11）'
        type: boolean
        default: false
      oi_rebuild:
        description: 'AC-CL-2：選擇權 OI 欄位改版後整段重抓（既有快照沒有 ml 欄位，不重抓的話主力成本推估要等好幾天才有東西可看）。約 10 分鐘'
        type: boolean
        default: false

# 固定 group 名稱讓所有 run 排同一隊：後到的排隊等前面跑完（不取消），
# 避免兩個 run 同時「下載快照→改→上傳」互相覆蓋（lost update）
concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch-and-upload:
    # 06:07 全球指數、選擇權 OI 四班都不跑這個 job（各自交給下面的獨立 job）
    if: >-
      github.event_name != 'schedule' ||
      (github.event.schedule != '7 22 * * *' && github.event.schedule != '32 7 * * 1-5'
       && github.event.schedule != '25 6 * * 1-5' && github.event.schedule != '45 6 * * 1-5'
       && github.event.schedule != '5 7 * * 1-5' && github.event.schedule != '25 7 * * 1-5')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # 02:07／08:07 這兩班不受開盤限制，略過 FMTQIK Guard（Guard 2）——今日資料已完整時
      # 仍會被 Guard 1 攔下，R4 的 FORCE_FULL_RUN 才是穿透 Guard 1 的開關
      FORCE_SKIP_GUARD2: ${{ (github.event.schedule == '7 18 * * *' || github.event.schedule == '7 0 * * *') && 'true' || '' }}
      # R4：/review 的「強制執行」按鈕與手動 dispatch 勾選 force_run 專用，連 Guard 1（今日已完成）
      # 都要跳過，否則資料已完整時按鈕會靜默無效
      FORCE_FULL_RUN: ${{ github.event.inputs.force_run == 'true' && 'true' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # 假日判斷（TWSE 官方休市日曆，不受任何 Guard 限制，永遠執行）：
      # 供前端判斷「今天沒資料是因為休市」還是「還沒到更新時間」
      - name: 檢查台股是否為休市日
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/check-holiday.mjs

      # 輕量 Guard 前置（零依賴、讀 ~1KB meta.json）：
      # 被攔截的 run 在這裡結束（~30 秒），不裝依賴、不下載 10MB 快照
      - name: Guard 前置檢查
        id: guard
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: node scripts/guard-check.mjs

      # AC-UP-2：原本這裡還有一個獨立的「npm install firebase-admin --no-save」步驟，
      # 但 firebase-admin 早就在 package.json devDependencies，npm ci 已經會裝好，
      # 那步是重複且用不鎖版本的方式重裝，反而是風險點——2026-09-11 事故的根因是
      # @google-cloud/firestore 屬於 firebase-admin 的 optionalDependencies，
      # npm 在 Actions 上裝不上也不會讓 npm ci 失敗，直到 write-firebase.mjs 執行期間
      # 才報 Cannot find module。已改把它列為 package.json 的必要依賴（AC-UP-1），
      # 裝不上時 npm ci 這步會直接失敗，不必再靠這個獨立步驟補裝
      - name: Install dependencies
        if: steps.guard.outputs.SHOULD_RUN == 'true'
        run: npm ci

      - name: 抓取每日行情（含兩道 Guard：已完成 / 非交易日）
        if: steps.guard.outputs.SHOULD_RUN == 'true'
        id: fetch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # AC-FIX-4：guard-check 偵測到「股價／融資落後於最近交易日」時會輸出 SKIP_GUARD2=true，
          # 這裡覆寫 job 層的值，讓 fetch-daily.mjs 內部的 Guard 2 一起放行。
          # 不能只靠 job 層那個 github.event.schedule 字串比對——2026-09-02 實測它沒有成立
          FORCE_SKIP_GUARD2: ${{ steps.guard.outputs.SKIP_GUARD2 || env.FORCE_SKIP_GUARD2 }}
        run: |
          node scripts/fetch-daily.mjs
          # 確認 latest.json stocks 非空 → 代表本次 run 實際跑了完整 pipeline
          if node -e "
            const d = JSON.parse(require('fs').readFileSync('data/latest.json','utf-8'));
            process.exit(d.stocks && d.stocks.length > 0 ? 0 : 99);
          " 2>/dev/null; then
            echo "PIPELINE_RAN=true" >> $GITHUB_OUTPUT
            echo "✅ Pipeline 執行完成"
          else
            echo "PIPELINE_RAN=false" >> $GITHUB_OUTPUT
            echo "⏭️ 本次 run 被 Guard 攔截，跳過（正常行為）"
          fi

      - name: 計算市場訊號
        if: steps.fetch.outputs.PIPELINE_RAN == 'true'
        run: node scripts/calc-signals.mjs 100

      # 市場熱度（AC-HT-C3）：讀 Supabase 的 heat-history.json、追加當日特徵、
      # 算 heat/warn/entry 三個數字寫進 indexHistory。歷史檔不存在時只印警告不中斷
      #（需先在本機跑 scripts/backfill-heat-history.py 完成一次性回補）。
      # 放在 write-firebase 之前，讓三個值跟著 indexHistory 一起進 market.json
      - name: 計算市場熱度
        if: steps.fetch.outputs.PIPELINE_RAN == 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/calc-heat.mjs

      - name: 上傳 Supabase + Firestore
        if: steps.fetch.outputs.PIPELINE_RAN == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/write-firebase.mjs

      # AC-OI-A10：選擇權 OI 的尾端保險。專用班次（14:25~15:25）萬一全被 GitHub 漏跑，
      # 靠這裡補；已有當日資料時腳本會早退，幾秒結束，所以不另開 runner
      - name: 抓選擇權 OI（尾端保險）
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/fetch-options-oi.mjs

  # P2-3：全球指數，只在台北 06:07 這班跑。不裝依賴（腳本零依賴、只用內建 fetch），
  # 不動 latest.json/主 pipeline，AC(d) 要求 <1 分鐘結束
  fetch-global-indices:
    if: >-
      (github.event_name == 'schedule' &&
        (github.event.schedule == '7 22 * * *' || github.event.schedule == '32 7 * * 1-5'))
      || github.event.inputs.fetch_global == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取全球指數（Yahoo Finance chart API）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/fetch-global.mjs

  # 功能二十三（AC-OI-A8/A9）：選擇權 OI 輕量班次。零依賴、已有當日資料就早退，
  # 所以排五班的成本趨近於零。workflow_dispatch（含 /review 後台「強制執行」）不帶
  # schedule 值，兩個 job 的條件都會成立 → 按下去主 pipeline 與這支都會跑，
  # force-run/route.ts 因此一行都不用改
  options-oi:
    if: >-
      (github.event_name == 'schedule' &&
        (github.event.schedule == '5 6 * * 1-5' || github.event.schedule == '25 6 * * 1-5'
         || github.event.schedule == '45 6 * * 1-5' || github.event.schedule == '5 7 * * 1-5'
         || github.event.schedule == '25 7 * * 1-5'))
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 平常早退只要幾秒；勾 oi_rebuild 整段重抓 30 天約 10 分鐘，5 分鐘會被砍掉
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取選擇權 OI（期交所 optDailyMarketReport）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # 勾了 oi_rebuild 才整段重抓；平常留空，維持「已有資料就早退」的輕量行為
          OPTIONS_OI_REBUILD: ${{ github.event.inputs.oi_rebuild == 'true' && '1' || '' }}
          OPTIONS_OI_BACKFILL: ${{ github.event.inputs.oi_rebuild == 'true' && '30' || '' }}
        run: node scripts/fetch-options-oi.mjs
